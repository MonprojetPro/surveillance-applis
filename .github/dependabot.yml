# T-092 etage 3 (MonProjetPro, 18-11) — failles connues des dependances.
# ALERTES SEULEMENT : les corrections automatiques sont COUPEES dans les reglages
# du depot (18-11, elles sautaient des grandes versions et cassaient le build).
# open-pull-requests-limit: 0 = aucune mise a jour de confort non plus.
# Les mises a jour se font a la main, avec build + tests (MonProjetPro).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      correctifs-securite-actions:
        applies-to: security-updates
        patterns: ["*"]
