name: Surveillance des applis

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Envoyer une notification de test sur le telephone'
        type: boolean
        default: false

permissions:
  contents: write

# Deux passages ne se chevauchent jamais (sinon l'etat serait ecrit deux fois).
concurrency:
  group: surveillance
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests du surveillant
        run: node --test

      - name: Verifier les applis
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node surveiller.mjs ${{ inputs.test_notification && '--test' || '' }}

      - name: Memoriser l'etat (seulement s'il a change)
        if: always()
        run: |
          if [ -n "$(git status --porcelain etat/)" ]; then
            git config user.name "surveillance-applis"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add etat/
            git commit -m "etat: $(date -u +%Y-%m-%dT%H:%MZ)"
            # La liste des applis a pu etre modifiee pendant le passage : on se recale avant de pousser.
            git pull --rebase --quiet
            git push
          fi
